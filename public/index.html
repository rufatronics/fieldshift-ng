</style></head><body>
<div class="frame">

<p class="sm" data-i="wi"></p><label for="dRain"><span data-i="rain"></span>: <b id="vr">0</b>%</label><input type="range" id="dRain" min="-30" max="20" value="0"><label for="dT"><span data-i="heat"></span>: +<b id="vt">0</b> C</label><input type="range" id="dT" min="0" max="3" step="0.5" value="0"></details>

<main id="pt" class="pad" hidden><p class="sm mono">English only. Rules and weights decide. The AI only explains the result.</p><div id="chain"></div></main>
<footer>RULES DECIDE. AI ONLY EXPLAINS. A FARMER OR AGRONOMIST MUST CONFIRM BEFORE ACTING.</footer></div>
<script src="data.js"></script><script src="zones.js"></script><script src="i18n.js"></script>
<script>
const $=i=>document.getElementById(i),sum=a=>a.reduce((x,y)=>x+y,0),cl=(x,a=0,b=100)=>Math.max(a,Math.min(b,x)),MO="JFMAMJJASOND",MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const EM={millet:"🌾",sorghum:"🌾",maize:"🌽",cowpea:"🫘",groundnut:"🥜",rice:"🍚"},KS=["water","heat","season","flood","store","soil","market"],GK=["g1","g2","g3","g4"];
let LG="en",SAVED=false,S,LAST,TAB=1,TC,AI=null,RUN=0,TOK=0;try{const v=localStorage.getItem("fs-lang");if(v&&I18N[v]){LG=v;SAVED=true}}catch(e){}
document.body.classList.toggle("dk",matchMedia("(prefers-color-scheme:dark)").matches);
const S0=()=>({zone:null,low:false,irr:false,store:"ok",cur:[],pref:[],w:{water:3,soil:3,store:3,cash:3},dRain:0,dT:0,done:false});S=S0();
const PP=()=>S.done?S:Object.assign(S0(),{zone:Object.keys(ZONES)[0],cur:["sorghum","millet","groundnut"]});
const cn=(l,c)=>{const en=CN[c][0],n=l=="en"?en:CN[c][{ha:1,yo:2,ig:3}[l]];return n==en?en:n+" ("+en+")"};
const T=(l,k,a=[],c)=>(I18N[l][k]||I18N.en[k]).replace(/\{(\d|c)\}/g,(m,i)=>i=="c"?cn(l,c):a[+i]),t=(k,a)=>T(LG,k,a),N=c=>cn(LG,c);
function X(p){const z=ZONES[p.zone],rain=z.rain.map(r=>r*(1+p.dRain/100));return{z,rain,tmax:z.tmax.map(t=>t+p.dT),season:rain.filter(r=>r>=50).length*30+20}}
const win=c=>[...Array(Math.ceil(c.cyc/30))].map((_,k)=>(c.pm-1+k)%12);
// Rules decide; nothing here is generated by an LLM.
function crop(id,p,x){const c=CROPS[id],w=win(c),R=[],S={},add=(i,k,key,a=[])=>R.push({id:i,k,key,a,c:id});
 const rain=sum(w.map(m=>x.rain[m]))+(p.irr?150:0),tpk=Math.max(...w.map(m=>x.tmax[m])),pk=Math.max(...w.map(m=>x.rain[m])),r0=Math.round(rain);
 S.water=cl((rain-c.w[0]*.8)/(c.w[1]-c.w[0]*.8)*100);
 if(rain<c.w[0]*.8)add("R-WATER-01","x","w1x",[r0,c.w[0]]);else if(S.water<60)add("R-WATER-01","p","w1p",[r0,c.w[0],c.w[1]]);
 S.season=cl(140-100*c.cyc/x.season);if(c.cyc>x.season)add("R-SEASON-02","x","s2",[c.cyc,x.season]);
 const lim=27+2*c.heat;S.heat=cl(100-(tpk-lim)*15);if(S.heat<60)add("R-HEAT-03","p","h3",[tpk.toFixed(1),lim]);
 const fr=(p.low?1:.25)*cl(pk/3);S.flood=cl(100-fr*(5-c.flood)/4);
 if(p.low&&S.flood<20)add("R-FLOOD-04","x","f4x");else if(S.flood<60)add("R-FLOOD-04","p","f4p");
 const hm=(c.pm-1+Math.ceil(c.cyc/30))%12,hr=x.z.rh[hm];S.store=cl(100-cl((hr-45)*2.5)*c.rot/5*({good:.4,ok:.8,poor:1.3}[p.store]));
 if(S.store<60)add("R-STORE-05","p","t5",[MN[hm],hr]);
 S.soil=cl(40+30*c.nfix+6*c.ero);S.market=p.pref.includes(id)?100:55;
 const W={water:1+p.w.water,heat:1.5,season:1.5,flood:1.5,store:1+p.w.store,soil:1+p.w.soil,market:.5+p.w.cash*.5};
 const out=R.some(r=>r.k=="x");return{id,S,R,out,W,sc:out?0:KS.reduce((a,k)=>a+S[k]*W[k],0)/sum(Object.values(W))}}
function rot(seq,p,x){const cs=seq.map(i=>crop(i,p,x)),notes=[];let s=sum(cs.map(c=>c.sc))/seq.length;
 if(!seq.some(i=>CROPS[i].fam=="legume")){s-=10;notes.push({id:"R-SEQ-01",key:"q1",a:[]})}
 let rep=0,bon=0;seq.forEach((a,i)=>{const b=seq[(i+1)%seq.length];if(a==b)rep++;else if(CROPS[a].fam!=CROPS[b].fam)bon++});
 if(rep){s-=8*rep;notes.push({id:"R-SEQ-02",key:"q2",a:[rep]})}if(bon){s+=2*bon;notes.push({id:"R-SEQ-03",key:"q3",a:[bon]})}
 const bad=cs.some(c=>c.out);if(bad)notes.push({id:"R-GATE",key:"g",a:[]});return{seq,cs,notes,s:cl(s),bad}}
function cands(p,x){const ok=Object.keys(CROPS).map(i=>crop(i,p,x)).filter(c=>!c.out).sort((a,b)=>b.sc-a.sc).slice(0,5).map(c=>c.id),L=[];
 ok.forEach(a=>ok.forEach(b=>ok.forEach(c=>{if(a!=b&&b!=c&&c!=a)L.push(rot([a,b,c],p,x))})));
 const seen={};return L.sort((a,b)=>b.s-a.s).filter(r=>{const k=[...r.seq].sort().join();return seen[k]?0:seen[k]=1})}
const rtxt=(l,r)=>r.map(q=>[q.id,T(l,q.key,q.a,q.c),q.k]),facts=(l,r)=>r.cs.flatMap(c=>rtxt(l,c.R)).concat(rtxt(l,r.notes));
function calc(){const p=PP(),x=X(p),base=rot(p.cur,p,x),c=cands(p,x);LAST={p,x,base,c:c.slice(0,2)};return LAST}
const brief=r=>({crops:r.seq.map(c=>CN[c][0]),score:Math.round(r.s),checks:facts("en",r).map(q=>q[0]+" "+q[1]),gaps:GK.map(g=>T("en",g))});
const screen=()=>{const{p,x}=LAST;return Object.keys(CROPS).map(i=>{const c=crop(i,p,x);return{crop:CN[i][0],score:Math.round(c.sc),removed:c.out?c.R.filter(r=>r.k=="x").map(r=>r.id):undefined}})};
const chart=(z,cap)=>`<div class="cht"><div class="bars">${z.rain.map(r=>`<div class="col"><span>${Math.round(r)}</span><i class="${r>=50?"on":""}" style="height:${Math.max(2,r/Math.max(...z.rain)*88)}%"></i></div>`).join("")}</div><div class="ax">${[...MO].map(m=>`<em>${m}</em>`).join("")}</div><div class="cap">${cap}</div></div>`;
function card(r,title){const u=3+2*GK.length,s=Math.round(r.s),b=r.bad?"weak":s>=75?"good":s>=55?"fair":"weak",f=facts(LG,r).map(q=>`<li${q[2]=="x"?' class="x"':""}>${q[1]} <small>${q[0]}</small></li>`).join("");
 return`<div class="card ${b}"><div class="ch"><div class="ti mono">${title}</div><div class="bd">${t(b)}</div><div class="seq">${r.seq.map((c,i)=>`<div class="cr"><small>${t("sn")} ${i+1}</small><b>${EM[c]} ${N(c)}</b></div>`).join("")}</div>
 <div class="sm">${t("range",[s,Math.max(0,s-u),Math.min(100,s+u)])}</div><h2>${t("warn")}</h2><ul>${f||"<li>"+t("nowarn")+"</li>"}</ul>
 <details><summary>${t("gaps")}</summary><ul>${GK.map(g=>"<li>"+t(g)+"</li>").join("")}</ul></details><p class="sm"><b>${t("review")}</b></p></div></div>`}
function cards(){const{base,c,p,x}=calc();$("cards").innerHTML=card(base,t("now"))+(c.length<2?`<span class="test">${t("none")}</span>`:"")+c.map(r=>card(r,t("opt"))).join("");
 $("rl").textContent=ZONES[p.zone].name.toUpperCase()+" · "+t("k_water").toUpperCase()+" mm";$("rc").innerHTML=chart(x,"2005–2025 · mm / month");$("vr").textContent=p.dRain;$("vt").textContent=p.dT}
// ---- AI helper: GET says whether the key is set; POST explains or answers; failure falls back, never breaks the page
async function callAI(q){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),25000);try{
 const r=await fetch("/api/narrate",{method:"POST",headers:{"Content-Type":"application/json"},signal:ac.signal,body:JSON.stringify({lang:LG,baseline:brief(LAST.base),options:LAST.c.map(brief),screen:screen(),q})});
 if(!r.ok)throw 0;return(await r.json()).text}catch(e){return null}finally{clearTimeout(to)}}
const local=()=>[LAST.base].concat(LAST.c).map((r,i)=>`${i?t("opt"):t("now")}: ${r.seq.map(N).join(" > ")} = ${Math.round(r.s)}/100`).join("\n")+"\n"+t("review");
function reveal(el,txt){const id=++TOK;if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=txt;return}const w=txt.split(" ");let i=0;const iv=setInterval(()=>{if(id!=TOK||i>=w.length)return clearInterval(iv);el.textContent=w.slice(0,++i).join(" ")},28)}
let VO=[];const hasTTS="speechSynthesis"in window,loadV=()=>{VO=speechSynthesis.getVoices()},voice=()=>VO.find(v=>v.lang.toLowerCase().startsWith(LG));if(hasTTS){loadV();speechSynthesis.onvoiceschanged=loadV}
async function explain(){const o=$("aitxt"),b=$("nar");b.disabled=true;$("lis").hidden=true;o.textContent=t("work");const r=await callAI(),txt=r||t("local")+":\n"+local();o.textContent="";reveal(o,txt);b.disabled=false;$("lis").hidden=!(hasTTS&&voice());$("lis").onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt),v=voice();if(v){u.voice=v;u.lang=v.lang}speechSynthesis.speak(u)}}
async function askQ(q){q=q.trim();if(!q||!S.done)return;$("qin").value="";const l=$("qlog"),a=document.createElement("div"),m=document.createElement("div");m.className="msg me";m.textContent=q;a.className="msg bot";a.textContent=t("work");l.append(m,a);
 const r=AI===false?t("aiNone"):await callAI(q);a.textContent=r||t("off").split(".")[0]+".";a.scrollIntoView({block:"nearest"})}
function aiStatus(){$("aist").textContent=AI===true?"● Gemma 4 · Google AI":AI===false?t("aiNone"):""}
// ---- Chat advisor
const th=()=>$("thread"),add=(c,h)=>{const d=document.createElement("div");d.className="msg "+c;if(c=="bot")d.innerHTML="<small>FIELDSHIFT</small>";d.append(h instanceof Node?h:document.createTextNode(h));th().appendChild(d);d.scrollIntoView({block:"nearest"})};
function pick(items,multi){return new Promise(res=>{const w=document.createElement("div");w.className="chips";const sel=new Set();
 items.forEach(([v,l])=>{const b=document.createElement("button");b.className="c2";b.textContent=l;b.onclick=()=>{if(!multi){w.remove();return res([v,l])}sel.has(v)?sel.delete(v):sel.add(v);b.setAttribute("aria-pressed",sel.has(v))};w.appendChild(b)});
 if(multi){const d=document.createElement("button");d.className="btn";d.textContent=t("done");d.onclick=()=>{w.remove();res([[...sel],[...sel].map(N).join(", ")||"–"])};w.appendChild(d)}
 th().appendChild(w);w.scrollIntoView({block:"nearest"})})}
async function run(){const id=++RUN,ask=async(q,items,multi)=>{add("bot",q);const r=await pick(items,multi);if(id!=RUN)throw 0;add("me",r[1]);return r[0]};S=S0();$("plan").hidden=true;th().innerHTML="";
 try{if(!SAVED){add("bot","Choose your language · Zaɓi harshe · Yan èdè · Họrọ asụsụ");const[l,n]=await pick(LANGS);if(id!=RUN)return;add("me",n);setLang(l,true)}
 add("bot",t("hi"));const yn=[[true,t("yes")],[false,t("no")]];
 S.zone=await ask(t("zone"),Object.keys(ZONES).map(k=>[k,ZONES[k].name]));S.low=await ask(t("lowQ"),yn);S.irr=await ask(t("irrQ"),yn);
 S.store=await ask(t("store"),[["good",t("sg")],["ok",t("sa")],["poor",t("sp")]]);
 for(let i=0;i<3;i++)S.cur.push(await ask(i?`${t("sn")} ${i+1}`:`${t("cur")} ${t("sn")} 1`,Object.keys(CROPS).map(k=>[k,EM[k]+" "+N(k)])));
 S.pref=await ask(t("pref"),Object.keys(CROPS).map(k=>[k,EM[k]+" "+N(k)]),true);S.done=true;add("bot",t("plan"));showPlan()}catch(e){}}
function showPlan(){$("plan").hidden=false;cards();$("qc").innerHTML="";["qa1","qa2","qa3"].forEach(k=>{const b=document.createElement("button");b.className="c2";b.textContent=t(k);b.onclick=()=>askQ(b.textContent);$("qc").appendChild(b)});$("qlog").innerHTML="";$("qin").placeholder=t("ask");explain();$("plan").scrollIntoView({block:"start"})}
// ---- Technical tab: same numbers as the decision chain
const RULES=[["R-WATER-01","gate/penalty","Rain in the crop's growing months (+150 mm if irrigated) vs its water need"],["R-SEASON-02","gate","Crop cycle longer than the rainy season removes the crop"],["R-HEAT-03","penalty","Hottest month in the window vs crop heat limit (27 + 2 x tolerance C)"],["R-FLOOD-04","gate/penalty","Peak monthly rain on a low plot vs flood tolerance"],["R-STORE-05","penalty","Harvest-month humidity x rot sensitivity x storage quality"],["R-SEQ-01","-10","Rotation has no legume"],["R-SEQ-02","-8 each","Same crop back to back"],["R-SEQ-03","+2 each","Switch between grain and legume"],["R-GATE","flag","Any crop in the rotation failed a gate: not recommended"]];
const nd=(n,h,b)=>`<div class="nd"><b>${n}</b><div><h3>${h}</h3>${b}</div></div>`,AR='<div class="ar">▼</div>',DM=typeof DATA_META!="undefined"&&DATA_META;
function tech(){const{p,x,base,c}=calc(),all=Object.keys(CROPS).map(i=>crop(i,p,x)),rem=all.filter(a=>a.out),W=all[0].W,ws=sum(Object.values(W)),pc=k=>(100*W[k]/ws).toFixed(0);
 if(!TC||!CROPS[TC])TC=(c[0]||base).seq[0];const cc=all.find(a=>a.id==TC),sc=r=>Math.round(r.s)+"/100",mr=x.rain.filter(r=>r>=50).length,bp=JSON.stringify({baseline:brief(base),options:c.map(brief),screen:screen()},null,1);
 $("chain").innerHTML=(S.done?"":'<div class="test">Example run. Finish the advisor to see your own numbers.</div>')+nd(1,"Inputs",`<p>Zone <b>${x.z.name}</b>: monthly rain, max temperature, humidity, NDVI${DM?" ("+DM.rainSource+" rain, "+[].concat(DM.years||[]).join("-")+")":" (demo data)"}.</p><p>Farmer: ${p.low?"low plot, ":""}${p.irr?"irrigation, ":""}storage ${p.store}, now ${p.cur.join(" → ")}. What-if: rain ${p.dRain}%, +${p.dT} C.</p>`)+AR
 +nd(2,"Season length",`<p>${mr} months with 50+ mm rain gives a season of about <b>${x.season} days</b>.</p>`)+AR
 +nd(3,"Gates (can remove a crop)",`<p>R-WATER-01, R-SEASON-02, R-FLOOD-04.</p><p>Removed now: <b>${rem.length?rem.map(a=>a.id+" ["+a.R.filter(r=>r.k=="x").map(r=>r.id)+"]").join(", "):"none"}</b> (${rem.length} of ${all.length}).</p>`)+AR
 +nd(4,"Score each crop on 7 factors",`<p>Weights now:</p><p>${KS.map(k=>`<span class="chip">${k} ${pc(k)}%</span>`).join("")}</p><p>Crop score = sum of (factor score x weight).</p>`)+AR
 +nd(5,"Combine into a rotation",`<p>Average of 3 crop scores, then R-SEQ-01 (-10), R-SEQ-02 (-8 each), R-SEQ-03 (+2 each). Any gate failure flags the rotation (R-GATE).</p>`)+AR
 +nd(6,"Rank",`<p>Your rotation: <b>${sc(base)}</b> ${base.seq.join(" → ")}</p>${c.map((r,i)=>`<p>Option ${i+1}: <b>${sc(r)}</b> ${r.seq.join(" → ")}</p>`).join("")||"<p>Fewer than 2 safe options.</p>"}`)+AR
 +nd(7,"AI explains and answers (Gemma 4 via Google AI)",`<p>Receives only the result below. Cannot change a score or add advice. If it fails, a local summary is shown.</p><details><summary>Exact payload sent</summary><pre>${bp}</pre></details>`)
 +`<h2>Why one crop scored what it did</h2><select id="tc" aria-label="crop">${Object.keys(CROPS).map(k=>`<option value="${k}"${k==TC?" selected":""}>${CROPS[k].n}</option>`).join("")}</select>
 ${cc.out?`<p class="sm"><b>Removed by gate:</b> ${cc.R.filter(r=>r.k=="x").map(r=>r.id+": "+T("en",r.key,r.a,r.c)).join("; ")}</p>`:""}
 ${KS.map(k=>`<div class="wr"><span>${k}</span><div class="trk"><div class="bar" style="width:${Math.round(cc.S[k])}%"></div></div><span>${Math.round(cc.S[k])} x ${pc(k)}%</span></div>`).join("")}
 <div class="wr"><b>score</b><div class="trk"><div class="bar m" style="width:${Math.round(cc.sc)}%"></div></div><b>${cc.out?"removed":Math.round(cc.sc)}</b></div>
 <h2>All crops</h2><div class="cs">${[...all].sort((a,b)=>b.sc-a.sc).map(a=>`<div>${a.out?"✗":"✓"} <b>${CROPS[a.id].n}</b> ${Math.round(a.sc)}${a.out?` <small>${a.R.filter(r=>r.k=="x").map(r=>r.id).join(", ")}</small>`:""}</div>`).join("")}</div>
 <h2>Rule registry</h2>${RULES.map(r=>`<p><code>${r[0]}</code> <small>${r[1]}</small><br>${r[2]}</p>`).join("")}
 <h2>Data and limits</h2>${PLACEHOLDER?'<span class="test">Crop parameters are placeholders until sourced and reviewed.</span>':""}<p class="sm">${DM?`${DM.repo}, ${DM.zones} zone(s), generated ${DM.generated}.`:"Demo climate data."} Zone-level data, not field-level. No soil or price data. A farmer or agronomist must confirm before acting.</p>`}

 $("lsel").innerHTML=LANGS.map(l=>`<option value="${l[0]}"${l[0]==LG?" selected":""}>${l[1]}</option>`).join("");$("ban").hidden=!PLACEHOLDER;$("ban").textContent=t("test");aiStatus();$("qin").placeholder=t("ask");
 const z=ZONES[Object.keys(ZONES)[0]];$("hl").textContent=z.name.toUpperCase()+" · MM / MONTH";$("hc").innerHTML=chart(z,"Dark bars = rainy months (50+ mm). Real zone climate data.");if(TAB==2)tech()}

$("lsel").onchange=e=>setLang(e.target.value);$("nar").onclick=explain;$("qsend").onclick=()=>askQ($("qin").value);$("qin").onkeydown=e=>{if(e.key=="Enter")askQ($("qin").value)};$("rs").onclick=()=>{S=S0();run();$("adv").scrollIntoView()};$("go").onclick=()=>$("adv").scrollIntoView();
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(+b.dataset.tab));
document.addEventListener("input",e=>{const i=e.target.id;if(i=="tc"){TC=e.target.value;return tech()}if(!S.done)return;
 if(i.startsWith("w_"))S.w[i.slice(2)]=+e.target.value;else if(i=="dRain"||i=="dT")S[i]=+e.target.value;else return;cards();TOK++;$("aitxt").textContent="";$("lis").hidden=true});
